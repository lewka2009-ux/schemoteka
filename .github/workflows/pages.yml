name: Publish Schemoteka
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - name: Download build from Google Drive
        id: get
        run: |
          curl -sSL -o site.zip "https://drive.usercontent.google.com/download?id=1suOZWqlAnx-iW-J58n37z0u8u8LGXKTz&export=download&confirm=t"
          mkdir site && unzip -q site.zip -d site
          test -f site/index.html
          NEW=$(cat site/version.txt)
          OLD=$(curl -fsSL "https://lewka2009-ux.github.io/schemoteka/version.txt" || echo none)
          echo "new=$NEW old=$OLD"
          if [ "$NEW" = "$OLD" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      # документация из сборки (site/docs) хранится в самом репозитории, папка docs/
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo
      - name: Save docs to repository
        run: |
          if [ -d site/docs ]; then
            mkdir -p repo/docs && cp -r site/docs/. repo/docs/
            cd repo
            git config user.name "schemoteka-bot"
            git config user.email "schemoteka-bot@users.noreply.github.com"
            git add docs
            if git diff --cached --quiet; then echo "docs: no changes"; else git commit -m "docs: update from Schemoteka build $(cat ../site/version.txt)" && git push; fi
          fi
      - uses: actions/configure-pages@v5
        if: steps.get.outputs.skip != '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.get.outputs.skip != '1'
        with:
          path: site
      - id: dep
        if: steps.get.outputs.skip != '1'
        uses: actions/deploy-pages@v4
